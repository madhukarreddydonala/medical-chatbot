[project]
name = "medical-chatbot"
version = "0.1.0"
description = "A grounded medical information chatbot powered by Groq and Pinecone"
readme = "README.md"
authors = [
    { name = "madhukarreddydonala", email = "madhukarreddy1744268@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "flask>=3.1.3",
    "groq>=0.37.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=0.3.0",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "setuptools>=84.0.0",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
